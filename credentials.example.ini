# Telegram API credentials template.
#
# You normally don't need to touch this file: on first run the scraper asks for
# these values and creates "credentials.ini" for you. (Or run: python scraper.py --setup)
#
# To fill it in by hand instead: copy this file to "credentials.ini" and replace the values.
# Get api_id / api_hash at https://my.telegram.org -> "API development tools".
#
# credentials.ini is listed in .gitignore - never share or commit it.

[telegram]
api_id = 1234567
api_hash = 0123456789abcdef0123456789abcdef
# International format. Leave empty to be asked at login.
phone = +972501234567
# Name of the saved login session file (stored in the "sessions" folder).
session_name = telegram_scraper
